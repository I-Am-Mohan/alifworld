name: AlifWorld Baseline CI Quality Gate

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Repository Verification & Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Configure Baseline Environment
        run: cp .env.example .env.local

      - name: Verify Code Formatting (Prettier)
        run: bun run format:check

      - name: Enforce Linting Rules (ESLint)
        run: bun run lint

      - name: Strict TypeScript Compilation (tsc --noEmit)
        run: bun run typecheck

      - name: Execute Full Automated Test Suite (bun:test)
        run: bun run test

      - name: Generate & Verify OpenAPI 3.1 Specification
        run: bun run openapi

      - name: Verify Next.js Production Compilation
        run: bun run build:local
