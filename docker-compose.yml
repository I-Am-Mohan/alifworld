version: '3.8'

# ==============================================================================
# AlifWorld Local Development Infrastructure Profiles
# Services: PostgreSQL 16, Redis 7, MinIO (S3), Meilisearch, Mailpit
# Reference: docs/architecture/local-development-infrastructure-profiles.md
# Invariant: Credentials strictly align with .env.example
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 (Relational Database for Prisma ORM)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: alifworld-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: alifworld
      POSTGRES_PASSWORD: alifworld_local_secret
      POSTGRES_DB: alifworld_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alifworld -d alifworld_dev']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    profiles:
      - core
      - full

  # ----------------------------------------------------------------------------
  # 2. Redis 7 (Distributed Cache, Rate Limits & BullMQ Queues)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: alifworld-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    profiles:
      - core
      - full

  # ----------------------------------------------------------------------------
  # 3. MinIO (S3-Compatible Local Object Storage for Media & Invoices)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: alifworld-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    profiles:
      - full

  # Setup one-shot container to create default bucket matching .env.example
  minio-setup:
    image: minio/mc:latest
    container_name: alifworld-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing local/alifworld-media;
      /usr/bin/mc anonymous set download local/alifworld-media;
      echo '[MinIO Setup] Initialized alifworld-media bucket.';
      exit 0;
      "
    profiles:
      - full

  # ----------------------------------------------------------------------------
  # 4. Meilisearch (Full-Text Storefront Catalog Search)
  # ----------------------------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: alifworld-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: masterKey123
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '7700:7700'
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:7700/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    profiles:
      - full

  # ----------------------------------------------------------------------------
  # 5. Mailpit (Local SMTP Mock & Web Email Inspector)
  # ----------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: alifworld-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP server
      - '8025:8025' # Web UI
    profiles:
      - full

volumes:
  postgres_data:
    name: alifworld_postgres_data
  redis_data:
    name: alifworld_redis_data
  minio_data:
    name: alifworld_minio_data
  meilisearch_data:
    name: alifworld_meilisearch_data
